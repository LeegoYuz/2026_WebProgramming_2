<!DOCTYPE html>
    <head>
        <title>작품목록 - 베리티켓</title>
        <meta charset="utf-8">
        <meta name="author" content="박지우">
        <link rel="stylesheet" href="style.css">
    </head>

    <header>
        <div class="header-inner">
            <div class="header-logo">
                <img src="res/logo_1.png" alt="로고" class="logo">
            </div>

            <div class="header-nav">
                <nav>
                    <ul>
                        홈
                        연극
                        뮤지컬
                    </ul>
                </nav>
            </div>

            <div class="header-search">
                <form class="header-right">
                    <input type="text" placeholder="검색어를 입력하세요">
                    <button class="search-button">
                        🔍
                    </button>
                </form>
            </div>
            고객센터
            로그인/회원가입
        </div>
    </header>
    
    <body class="main-wrapper">
        <h2>연극</h2>
        
        <section class="product-list">
            <!-- 각 아이템 항목 이거 패딩 안먹히는거 고쳐야됨 -->
            <div class="product-item">
                <div class="image-box">
                    <img src="res/thumbnail_Midnight.png" alt="포스터" class="thumbnail">
                </div>
                <div class="text-box">
                    <span class="category">뮤지컬</span>
                    <h3 class="title">미드나잇 : 액터뮤지션 &lt;THE CHOICE&gt;</h3>
                    <p class="price">₩41,900~</p>
                    <p class="rating">평점 ★★★★☆ (4.2)</p>
                </div>
            </div>

            <div class="product-item">
                <div class="image-box">
                    <img src="res/thumbnail_PhantomOfOpera.png" alt="포스터" class="thumbnail">
                </div>
                <div class="text-box">
                    <span class="category">뮤지컬</span>
                    <h3 class="title">&lt;오페라의 유령&gt; 40주년 스페셜 시즌 (Phantom of The Opera)</h3>
                    <p class="price">₩70,000~</p>
                    <p class="rating">평점 ★★★★★ (4.8)</p>
                </div>
            </div>

        </section>
    </body>

    <footer>
        <div class="footer-logo">
            <img src="res/logo_1.png" alt="로고" class="logo">
        </div>
    </footer>
</html>
