<!DOCTYPE html>
<head>
    <title>리뷰작성 - 베리티켓</title>
    <meta charset="utf-8">
    <meta name="author" content="이세나">
    <link rel="stylesheet" href="02_베리티켓_style.css">
    <link rel="stylesheet" href="02_베리티켓_review-write.css">
</head>
<header></header> <!-- mainPage header 복사 -->
<body id="top">
    <div class="main-wrapper">
        <section class="page-title">
            <h2>리뷰 <span>작성</span></h2>
            <!-- <p>관람한 공연에 대한 솔직한 후기를 남겨주세요.</p> -->
        </section>

        <!-- 백엔드가 없으니 등록하면 관객 리뷰 페이지로 돌아가게만 연결 -->
        <form class="write-form" action="02_베리티켓_review.html">

        <div class="form-row">
            <label for="show">관람 작품</label>
            <select id="show" name="show" required>
                <option value="">작품을 선택하세요</option>
                <option>뮤지컬 [미드나잇]</option>
                <option>뮤지컬 [스위니토드]</option>
                <option>뮤지컬 [오페라의 유령]</option>
                <option>연극 [프로젝트 르완다]</option>
            </select>
        </div>
        <div class="form-row">
            <label for="date">관람일</label>
            <input type="date" id="date" name="date" required>
        </div>
        <div class="form-row">
            <span class="row-label">별점</span>
            <div class="star-rating">
                <input type="radio" id="star5" name="rating" value="5" required><label for="star5">★</label>
                <input type="radio" id="star4" name="rating" value="4"><label for="star4">★</label>
                <input type="radio" id="star3" name="rating" value="3"><label for="star3">★</label>
                <input type="radio" id="star2" name="rating" value="2"><label for="star2">★</label>
                <input type="radio" id="star1" name="rating" value="1"><label for="star1">★</label>
            </div>            
        </div>
        <div class="form-row">
            <label for="oneline">한줄평</label>
            <div class="field">
                <input type="text" id="oneline" name="oneline" maxlength="30"
                    placeholder="공연을 한 줄로 표현해 주세요" required>
            <p class="hint">최대 30자</p> 
            </div>           
        </div>
        <div class="form-row">
            <label for="content">리뷰 내용</label>
            <div class="field">
                <textarea id="content" name="content" rows="8" minlength="20"></textarea>
            </div>
        </div>
        <div class="form-row">
            <label for="photo">사진 첨부</label>
            <div class="field">
                <input type="file" id="photo" name="photo" accept="image/*">
            </div>
        </div>
        <div class="form-buttons">
            <a href="02_베리티켓_review.html" class="btn-cancel">취소</a>
            <button type="submit" class="btn-submit">등록하기</button>           
        </div>
    </form>
    </div>
</body>
    <footer>
        <div class="footer-logo">
            <img src="res/02_Logo3.png" alt="로고" class="logo">
        </div>
        <p>(주)베리티켓 | 대표 홍길동 | 사업자등록번호 123-45-67890</p>
        <p>서비스 이용약관 | 개인정보 처리방침 | 회사 정보</p>
        <p>고객센터 전화번호 1111-1111</p>
        <p>© 2026 BERRYTICKET. All rights reserved.</p>
        <a href="#top" id="scrollTopBtn" title="최상단 바로가기">▲</a>
    </footer>
</html>
